name: Build Moldova OS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: debian:trixie
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y live-build ca-certificates imagemagick fonts-dejavu-core

      - name: Configure Moldova OS
        run: |
          BACK="$GITHUB_WORKSPACE/back.png"
          if [ ! -f "$BACK" ]; then
            echo "ERROR: back.png not found in the repository's main folder"
            exit 1
          fi

          mkdir moldova-os && cd moldova-os
          lb config \
            --distribution trixie \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --image-name moldova-os \
            --iso-volume "Moldova OS" \
            --iso-application "Moldova OS" \
            --iso-publisher "Moldova OS" \
            --bootappend-live "boot=live components quiet splash hostname=moldova-os username=user"

          P=config/includes.chroot/usr/share/plymouth/themes/moldova
          mkdir -p config/package-lists config/hooks/normal moldova-assets "$P" \
            config/includes.chroot/usr/share/moldova-os \
            config/includes.chroot/usr/local/bin \
            config/includes.chroot/etc/xdg/autostart \
            config/includes.chroot/etc/default/grub.d \
            config/includes.chroot/usr/share/lightdm/lightdm-gtk-greeter.conf.d

          # ---------- Artwork ----------
          IM=$(command -v magick || command -v convert)
          FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          A=moldova-assets

          # Desktop wallpaper = your back.png
          "$IM" "$BACK" "$A/wallpaper.png"

          # USB boot menu backgrounds
          "$IM" -size 1920x1080 xc:'#0b2a5b' \
            \( -size 640x14 xc:'#0046AE' -size 640x14 xc:'#FFD200' -size 640x14 xc:'#CC092F' +append \) \
            -gravity south -composite \
            -font "$FONT" -fill white -pointsize 90 -gravity north -annotate +0+70 'Moldova OS' \
            "$A/boot.png"
          "$IM" -size 640x480 xc:'#0b2a5b' \
            \( -size 214x8 xc:'#0046AE' -size 212x8 xc:'#FFD200' -size 214x8 xc:'#CC092F' +append \) \
            -gravity south -composite \
            -font "$FONT" -fill white -pointsize 40 -gravity north -annotate +0+24 'Moldova OS' \
            "$A/splash640.png"

          # Logo
          "$IM" -size 256x256 xc:none \
            \( -size 86x256 xc:'#0046AE' -size 84x256 xc:'#FFD200' -size 86x256 xc:'#CC092F' +append \) \
            -composite -font "$FONT" -fill white -stroke '#0b2a5b' -strokewidth 4 \
            -pointsize 180 -gravity center -annotate +0+0 'M' \
            "$A/logo.png"
          cat > "$A/logo.svg" <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256"><rect width="86" height="256" fill="#0046AE"/><rect x="86" width="84" height="256" fill="#FFD200"/><rect x="170" width="86" height="256" fill="#CC092F"/><text x="128" y="190" font-family="DejaVu Sans" font-weight="bold" font-size="180" text-anchor="middle" fill="#ffffff" stroke="#0b2a5b" stroke-width="4">M</text></svg>
          EOF

          cp "$A/wallpaper.png" "$A/boot.png" "$A/logo.png" "$A/logo.svg" \
            config/includes.chroot/usr/share/moldova-os/

          # ---------- Custom boot loading screen ----------
          "$IM" "$BACK" -resize '1920x1080^' -gravity center -extent 1920x1080 \
            -fill black -colorize 35 "$P/background.png"
          "$IM" "$A/logo.png" -resize 160x160 "$P/logo.png"
          "$IM" -background none -font "$FONT" -fill white -pointsize 64 label:'Moldova OS' "$P/title.png"
          "$IM" -background none -font "$FONT" -fill white -pointsize 28 label:'Enter password to unlock' "$P/prompt.png"
          "$IM" -size 400x6 xc:'#0046AE' -size 400x6 xc:none +append -crop 134x6+0+0 +repage \
            \( -size 132x6 xc:'#FFD200' \) \( -size 134x6 xc:'#CC092F' \) +append "$P/stripe.png"
          "$IM" -size 400x6 xc:'rgba(255,255,255,0.25)' "$P/bar-bg.png"
          "$IM" -size 400x6 xc:white "$P/bar.png"
          "$IM" -size 16x16 xc:none -fill white -draw 'circle 8,8 8,2' "$P/dot.png"

          cat > "$P/moldova.plymouth" <<'EOF'
          [Plymouth Theme]
          Name=Moldova OS
          Description=Moldova OS boot screen
          ModuleName=script

          [script]
          ImageDir=/usr/share/plymouth/themes/moldova
          ScriptFile=/usr/share/plymouth/themes/moldova/moldova.script
          EOF

          cat > "$P/moldova.script" <<'EOF'
          sw = Window.GetWidth();
          sh = Window.GetHeight();
          Window.SetBackgroundTopColor(0.04, 0.16, 0.36);
          Window.SetBackgroundBottomColor(0.04, 0.16, 0.36);

          bg.sprite = Sprite(Image("background.png").Scale(sw, sh));
          bg.sprite.SetZ(-10);

          logo.image = Image("logo.png");
          logo.sprite = Sprite(logo.image);
          logo.sprite.SetPosition(sw / 2 - logo.image.GetWidth() / 2, sh / 2 - logo.image.GetHeight() - 20, 1);

          title.image = Image("title.png");
          title.sprite = Sprite(title.image);
          title.sprite.SetPosition(sw / 2 - title.image.GetWidth() / 2, sh / 2 + 10, 1);

          stripe.image = Image("stripe.png");
          bx = sw / 2 - stripe.image.GetWidth() / 2;
          by = sh / 2 + 10 + title.image.GetHeight() + 30;
          stripe.sprite = Sprite(stripe.image);
          stripe.sprite.SetPosition(bx, by, 1);

          track.sprite = Sprite(Image("bar-bg.png"));
          track.sprite.SetPosition(bx, by + 20, 1);
          fill.image = Image("bar.png");
          fill.sprite = Sprite();
          fill.sprite.SetPosition(bx, by + 20, 2);

          fun progress_cb(duration, progress) {
            w = Math.Int(fill.image.GetWidth() * progress);
            if (w < 1) { w = 1; }
            fill.sprite.SetImage(fill.image.Scale(w, fill.image.GetHeight()));
          }
          Plymouth.SetBootProgressFunction(progress_cb);

          prompt.image = Image("prompt.png");
          prompt.sprite = Sprite();
          dot.image = Image("dot.png");

          fun display_password_cb(prompt_text, bullets) {
            prompt.sprite.SetImage(prompt.image);
            prompt.sprite.SetPosition(sw / 2 - prompt.image.GetWidth() / 2, by + 50, 3);
            prompt.sprite.SetOpacity(1);
            n = bullets;
            if (n > 32) { n = 32; }
            for (i = 0; i < 32; i++) {
              if (!global.dots[i]) { global.dots[i] = Sprite(dot.image); }
              global.dots[i].SetPosition(sw / 2 - (n * 20) / 2 + i * 20, by + 100, 3);
              if (i < n) { global.dots[i].SetOpacity(1); } else { global.dots[i].SetOpacity(0); }
            }
          }
          Plymouth.SetDisplayPasswordFunction(display_password_cb);

          fun display_normal_cb() {
            prompt.sprite.SetOpacity(0);
            for (i = 0; i < 32; i++) {
              if (global.dots[i]) { global.dots[i].SetOpacity(0); }
            }
          }
          Plymouth.SetDisplayNormalFunction(display_normal_cb);
          EOF

          # Show the boot screen on the installed system too
          cat > config/includes.chroot/etc/default/grub.d/moldova.cfg <<'EOF'
          GRUB_DISTRIBUTOR="Moldova OS"
          GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
          EOF

          # ---------- Software ----------
          cat > config/package-lists/desktop.list.chroot <<'EOF'
          task-xfce-desktop
          firefox-esr
          network-manager-gnome
          x11-xserver-utils
          plymouth
          plymouth-themes
          firmware-linux
          firmware-misc-nonfree
          firmware-iwlwifi
          firmware-realtek
          firmware-atheros
          firmware-brcm80211
          calamares-settings-debian
          EOF

          # ---------- Wallpaper on first login ----------
          cat > config/includes.chroot/usr/local/bin/moldova-set-wallpaper <<'EOF'
          #!/bin/sh
          W=/usr/share/moldova-os/wallpaper.png
          M="$HOME/.config/moldova-os/wallpaper-set"
          [ -f "$M" ] && exit 0
          sleep 4
          for mon in $(xrandr --listmonitors 2>/dev/null | awk 'NR>1 {print $NF}'); do
            for ws in 0 1 2 3; do
              xfconf-query -c xfce4-desktop -p "/backdrop/screen0/monitor$mon/workspace$ws/last-image" -n -t string -s "$W"
              xfconf-query -c xfce4-desktop -p "/backdrop/screen0/monitor$mon/workspace$ws/image-style" -n -t int -s 5
            done
          done
          for p in $(xfconf-query -c xfce4-desktop -l 2>/dev/null | grep 'last-image$'); do
            xfconf-query -c xfce4-desktop -p "$p" -s "$W"
          done
          mkdir -p "$(dirname "$M")" && touch "$M"
          EOF
          chmod +x config/includes.chroot/usr/local/bin/moldova-set-wallpaper

          cat > config/includes.chroot/etc/xdg/autostart/moldova-wallpaper.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Moldova OS wallpaper
          Exec=/usr/local/bin/moldova-set-wallpaper
          OnlyShowIn=XFCE;
          NoDisplay=true
          EOF

          # ---------- Login screen ----------
          cat > config/includes.chroot/usr/share/lightdm/lightdm-gtk-greeter.conf.d/99_moldova.conf <<'EOF'
          [greeter]
          background=/usr/share/moldova-os/wallpaper.png
          EOF

          # ---------- Branding inside the OS ----------
          cat > config/hooks/normal/0100-moldova-branding.hook.chroot <<'EOF'
          #!/bin/sh
          set -e
          A=/usr/share/moldova-os

          # System name (diverted so updates can't put "Debian" back)
          dpkg-divert --local --rename --divert /usr/lib/os-release.debian --add /usr/lib/os-release
          cat > /usr/lib/os-release <<'OSR'
          PRETTY_NAME="Moldova OS 1.0"
          NAME="Moldova OS"
          VERSION_ID="1.0"
          VERSION="1.0"
          ID=moldova-os
          ID_LIKE=debian
          HOME_URL="https://www.debian.org/"
          OSR
          ln -sf ../usr/lib/os-release /etc/os-release
          echo 'Moldova OS 1.0 \n \l' > /etc/issue
          echo 'Moldova OS 1.0' > /etc/issue.net
          echo 'Welcome to Moldova OS' > /etc/motd

          # Default wallpaper and installed-system GRUB background
          update-alternatives --install /usr/share/images/desktop-base/desktop-background desktop-background $A/wallpaper.png 999 || true
          update-alternatives --set desktop-background $A/wallpaper.png || true
          update-alternatives --install /usr/share/images/desktop-base/desktop-grub.png desktop-grub $A/boot.png 999 || true
          update-alternatives --set desktop-grub $A/boot.png || true

          # Custom boot loading screen
          plymouth-set-default-theme moldova
          update-initramfs -u -k all

          # Installer branding
          for d in /etc/calamares/branding /usr/share/calamares/branding; do
            if [ -d "$d/debian" ]; then
              cp -a "$d/debian" "$d/moldova"
              cd "$d/moldova"
              sed -i -E \
                -e 's/^( *)componentName:.*/\1componentName: moldova/' \
                -e 's/^( *)(productName|shortProductName|bootloaderEntryName):.*/\1\2: "Moldova OS"/' \
                -e 's/^( *)(versionedName|shortVersionedName):.*/\1\2: "Moldova OS 1.0"/' \
                -e 's/^( *)(version|shortVersion):.*/\1\2: "1.0"/' \
                branding.desc
              sed -i -e 's/Debian GNU\/Linux/Moldova OS/g' -e 's/Debian/Moldova OS/g' branding.desc
              for f in $(find . -name '*.png'); do
                case "$f" in
                  *slide*) cp $A/wallpaper.png "$f" ;;
                  *) cp $A/logo.png "$f" ;;
                esac
              done
              find . -name '*.svg' -exec cp $A/logo.svg {} \;
              find . -name '*.qml' -exec sed -i 's/Debian/Moldova OS/g' {} +
              cd /
            fi
          done
          for f in /etc/calamares/settings.conf /usr/share/calamares/settings.conf; do
            if [ -f "$f" ]; then sed -i -E 's/^branding:.*/branding: moldova/' "$f"; fi
          done
          for f in /usr/share/applications/*.desktop; do
            if grep -qi calamares "$f"; then sed -i 's/Debian/Moldova OS/g' "$f"; fi
          done
          EOF
          chmod +x config/hooks/normal/0100-moldova-branding.hook.chroot

          # ---------- USB boot menu ----------
          cat > config/hooks/normal/9000-moldova-bootmenu.hook.binary <<'EOF'
          #!/bin/sh
          set -e
          if [ -d binary ]; then B=binary; R=.; else B=.; R=..; fi
          A="$R/moldova-assets"
          find "$B" -name splash.png | while read -r f; do
            case "$f" in
              *isolinux*|*syslinux*) cp "$A/splash640.png" "$f" ;;
              *) cp "$A/boot.png" "$f" ;;
            esac
          done
          find "$B" \( -name '*.cfg' -o -name 'theme.txt' \) -exec sed -i \
            -e 's/Live system/Moldova OS Live/g' \
            -e 's/Debian GNU\/Linux/Moldova OS/g' \
            -e 's/Debian/Moldova OS/g' {} +
          EOF
          chmod +x config/hooks/normal/9000-moldova-bootmenu.hook.binary

      - name: Build ISO
        run: |
          cd moldova-os
          lb build
          ls -lh *.iso

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: moldova-os-iso
          path: moldova-os/moldova-os-amd64.hybrid.iso
          compression-level: 0
          retention-days: 14
